# Workflow 3 de 3.
# Proposito: publicar la aplicacion completa (frontend + backend) en Render.
# Render vuelve a construir el proyecto y lo deja en la URL publica.
#
# Requisito: crear el secreto RENDER_DEPLOY_HOOK en
# GitHub > Settings > Secrets and variables > Actions, con la URL del
# "Deploy Hook" que da Render en Settings del servicio.
#
# Resultado verificable: el paso imprime el id del deploy que creo Render,
# y ese deploy aparece en el panel de Render y en la web publicada.
name: Deploy a Render

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pedir a Render que publique la ultima version
        run: |
          respuesta=$(curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          echo "Respuesta de Render: $respuesta"
