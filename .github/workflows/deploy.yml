# Workflow 3 de 3.
# Proposito: publicar la aplicacion completa (frontend + backend) en Render.
#
# Es independiente de los otros dos workflows: no los necesita y ellos no lo
# necesitan a el. Lo unico que hace es avisarle a Render que construya y
# publique la ultima version. Render tiene autoDeploy desactivado
# (ver render.yaml), asi que este workflow es el unico que dispara deploys.
#
# Requisito: crear el secreto RENDER_DEPLOY_HOOK en
# GitHub > Settings > Secrets and variables > Actions, con la URL del
# "Deploy Hook" que da Render en Settings del servicio.
#
# Resultado verificable: el paso imprime el id del deploy que creo Render,
# y ese deploy aparece en el panel de Render y en la web publicada.
name: Deploy a Render

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pedir a Render que publique la ultima version
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Falta el secreto RENDER_DEPLOY_HOOK en GitHub."
            echo "Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          respuesta=$(curl -sf -X POST "$HOOK")
          echo "Respuesta de Render: $respuesta"
